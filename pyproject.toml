[project]
name = "voice-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.123",
    "easyocr>=1.7.2",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-fastocr>=0.1.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.16",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "unstructured[pdf]>=0.27.36",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require external services or integration infrastructure",
]
