[project]
name = "SaviraCortex-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.123",
    "chromadb>=0.5.0",
    "easyocr>=1.7.2",
    "fastapi>=0.162.0",
    "firebase-admin>=6.5.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-fastocr>=0.1.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.16",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.14.2",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-trio>=0.8.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.1.6",
    "unstructured[pdf]>=0.27.36",
    "deepeval>=4.3.2",
    "ragas>=0.4.3",
    "chardet>=5.2.0,<7",
    "langgraph-checkpoint-postgres>=3.2.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services or integration infrastructure",
]

[dependency-groups]
dev = [
    "pytest-asyncio",
]
